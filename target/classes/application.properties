# =============================================
# PostgreSQL DataSource
# =============================================
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/sitemanager_db
spring.datasource.username=postgres
spring.datasource.password=ajay

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT Settings  (change secret in production!)
# =============================================
app.jwt.secret=SiteManager_Super_Secret_Key_Change_In_Production_2024!
app.jwt.expiration-ms=86400000

# =============================================
# JSP View Resolver (keep existing MVC)
# =============================================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# =============================================
# CORS — allow Angular dev server
# =============================================
app.cors.allowed-origins=http://localhost:4200

# =============================================
# Server
# =============================================
server.port=8080

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
